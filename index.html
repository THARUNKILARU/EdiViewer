<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBATPA EDI Viewer — HIPAA X12 5010</title>
  <meta name="description" content="IBATPA EDI Viewer — HIPAA X12 5010 SNIP Level 1-6 Validation. Built by Tharun Kilaru, International Benefits Administrators." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #f0f4f8; color: #1e293b; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.35s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    // ─── HIPAA CODE TABLES ───────────────────────────────────────
    const REL={'18':'Self','01':'Spouse','19':'Child','21':'Unknown','34':'Other Adult','15':'Ward','17':'Step Child','23':'Sponsored Dependent','25':'Ex-Spouse','31':'Mother','32':'Father','53':'Life Partner','G8':'Other Relationship'};
    const MTYPE={'001':'Change','021':'Addition','024':'Cancellation or Termination','025':'Reinstatement','030':'Audit or Compare','033':'COBRA Begin','034':'COBRA End'};
    const MREASON={'20':'Active','28':'Initial Enrollment','29':'Benefits Terminated','38':'Termination of Benefits','AI':'Initial Enrollment','XN':'Name Change','01':'Divorce','02':'Birth','03':'Death','04':'Retirement','05':'Adoption','09':'COBRA Election','14':'Involuntary Disenrollment','15':'Military Duty'};
    const BSTATUS={A:'Active',C:'COBRA',S:'Surviving Insured',T:'Tax Levy'};
    const EMPST={AC:'Active Full-Time',FT:'Full-Time',PT:'Part-Time',RT:'Retired',TE:'Terminated','L1':'Leave of Absence'};
    const ENTITY={P5:'Plan Sponsor',IN:'Insurer',IL:'Insured or Subscriber','1P':'Provider',PR:'Payer','85':'Billing Provider','87':'Pay-to Provider',FA:'Facility',QC:'Patient','41':'Submitter','40':'Receiver','36':'Employer','2B':'Third-Party Administrator',EX:'Eligible Survivor'};
    const IDQUAL={FI:"Federal Taxpayer's ID",MI:'Member Identification',PI:'Payer Identification',XX:'National Provider Identifier (NPI)',ZZ:'Mutually Defined','34':'Social Security Number',EI:"Employer's ID Number",HN:'Health Insurance Claim Number'};
    const DATEQUAL={'348':'Benefit Begin','349':'Benefit End','300':'Enrollment Signature Date','301':'Maintenance Effective Date','303':'Maintenance Expiration','356':'Eligibility Begin','357':'Eligibility End','007':'Effective','036':'Policy Expiration','153':'Date of Service','435':'Admission Date','096':'Discharge Date','431':'Onset of Current Symptoms','454':'Initial Treatment','472':'Service Date','439':'Accident Date'};
    const DATEFMT={D8:'Date Expressed In Format Ccyymmdd',RD8:'Range of Dates Ccyymmdd-Ccyymmdd',D6:'Date In Format Yymmdd'};
    const GENDER={M:'Male',F:'Female',U:'Unknown'};
    const COVERAGE={EMP:'Employee Only',ESP:'Employee and Spouse',FAM:'Family',IND:'Individual',SPC:'Spouse and Children',ECH:'Employee and Children',TWO:'Two-Party'};
    const INSLINE={HLT:'Health',DEN:'Dental',VIS:'Vision',ANC:'Ancillary',FAC:'Facility',PPO:'Preferred Provider Org.',HMO:'Health Maintenance Org.'};
    const GSCODE={BE:'Benefit Enrollment and Maintenance (834)',FA:'Functional Acknowledgment (997/999)',HC:'Health Care Claim (837)',HP:'Health Care Claim Payment/Advice (835)',HS:'Eligibility Inquiry (270)',HB:'Eligibility Response (271)',HR:'Claim Status Request (276)',HN:'Claim Status Notification (277)'};
    const TXSET={'834':'Benefit Enrollment And Maintenance','837':'Health Care Claim','835':'Health Care Claim Payment/Advice','270':'Eligibility, Coverage or Benefit Inquiry','271':'Eligibility, Coverage or Benefit Response','276':'Health Care Claim Status Request','277':'Health Care Claim Status Notification','999':'Implementation Acknowledgment','997':'Functional Acknowledgment'};
    const POS={'11':'Office','12':'Home','21':'Inpatient Hospital','22':'On Campus-Outpatient Hospital','23':'Emergency Room','24':'Ambulatory Surgical Center','31':'Skilled Nursing Facility','32':'Nursing Facility','81':'Independent Laboratory','20':'Urgent Care Facility','51':'Inpatient Psychiatric Facility'};
    const MARITAL={I:'Single',M:'Married',R:'Registered Domestic Partner',S:'Separated',U:'Unknown',W:'Widowed',D:'Divorced'};
    const STUDENT={F:'Full-Time',N:'Not a Student',P:'Part-Time'};
    const VALID_STATES=new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC','PR','VI','GU']);
    const REFREASONS={'0F':'Subscriber Number','1L':'Group or Policy Number','ZZ':'Mutually Defined','23':'Client Number','CE':'Class of Contract Code','CT':'Contract Number','EA':'Medical Record ID','F6':'Health Insurance Claim Number','G1':'Prior Authorization Number','IG':'Insurance Policy Number','SY':'Social Security Number','Y4':'Agency Claim Number','3H':'Case Number','P5':'Plan ID','QQ':'Member ID Number'};
    const CLPSTATUS={'1':'Processed as Primary','2':'Processed as Secondary','3':'Processed as Tertiary','4':'Denied','19':'Processed as Primary, Forwarded to Payer','22':'Reversal of Previous Payment','23':'Not Our Claim'};
    const CASGROUP={CO:'Contractual Obligations',CR:'Corrections and Reversals',OA:'Other Adjustments',PI:'Payer Initiated Reductions',PR:'Patient Responsibility'};

    // ─── DATE VALIDATION ────────────────────────────────────────
    function isValidD8(s){
      if(!s||s.length!==8)return false;
      const y=parseInt(s.slice(0,4)),m=parseInt(s.slice(4,6)),d=parseInt(s.slice(6,8));
      if(m<1||m>12||d<1||y<1800||y>2100)return false;
      return d<=new Date(y,m,0).getDate();
    }

    // ─── SNIP ENGINE ─────────────────────────────────────────────
    function mkErr(level,severity,seg,field,message){return{level,severity,seg,field,message,id:Math.random().toString(36).slice(2)};}

    function snip1(rawSegs){
      const e=[];
      if(!rawSegs.length){e.push(mkErr(1,'ERROR','ISA','ISA','File is empty'));return e;}
      const isa=rawSegs[0].split('*');
      if(isa[0]!=='ISA'){e.push(mkErr(1,'ERROR','ISA','ISA01','File must begin with ISA segment'));return e;}
      if(isa.length<17)e.push(mkErr(1,'ERROR','ISA','ISA','ISA requires 16 data elements, found '+(isa.length-1)));
      if(isa[13]&&!/^\d{9}$/.test(isa[13].trim()))e.push(mkErr(1,'ERROR','ISA','ISA13','ISA13 Control Number must be 9 digits, found: '+isa[13].trim()));
      if(isa[15]&&!['T','P','I'].includes(isa[15]))e.push(mkErr(1,'ERROR','ISA','ISA15','ISA15 must be T or P, found: '+isa[15]));
      const ieaArr=rawSegs.filter(s=>s.split('*')[0]==='IEA');
      if(!ieaArr.length)e.push(mkErr(1,'ERROR','IEA','IEA','Missing IEA — interchange not properly terminated'));
      const gsCount=rawSegs.filter(s=>s.split('*')[0]==='GS').length;
      const geCount=rawSegs.filter(s=>s.split('*')[0]==='GE').length;
      if(gsCount!==geCount)e.push(mkErr(1,'ERROR','GS/GE','--','GS count ('+gsCount+') does not match GE count ('+geCount+')'));
      const stCount=rawSegs.filter(s=>s.split('*')[0]==='ST').length;
      const seCount=rawSegs.filter(s=>s.split('*')[0]==='SE').length;
      if(stCount!==seCount)e.push(mkErr(1,'ERROR','ST/SE','--','ST count ('+stCount+') does not match SE count ('+seCount+')'));
      if(ieaArr.length){const iea=ieaArr[0].split('*');if(iea[1]&&parseInt(iea[1])!==gsCount)e.push(mkErr(1,'ERROR','IEA','IEA01','IEA01 ('+iea[1]+') does not match GS count ('+gsCount+')'));if(isa[13]&&iea[2]&&isa[13].trim()!==iea[2].trim())e.push(mkErr(1,'ERROR','ISA/IEA','ISA13/IEA02','Control number mismatch: ISA13='+isa[13].trim()+' vs IEA02='+iea[2].trim()));}
      return e;
    }

    function snip2(ts){
      const e=[],body=ts._rawBody||[],ids=body.map(s=>s.elements[0]);
      if(ts.code==='834'){
        if(!ids.includes('BGN'))e.push(mkErr(2,'ERROR','BGN','BGN','834 requires BGN (Beginning Segment)'));
        else{const bgn=body.find(s=>s.elements[0]==='BGN');if(!['00','15','22','46'].includes(bgn.elements[1]))e.push(mkErr(2,'ERROR','BGN','BGN01','BGN01 invalid: '+bgn.elements[1]+' — valid: 00,15,22,46'));}
        if(!body.find(s=>s.elements[0]==='N1'&&s.elements[1]==='P5'))e.push(mkErr(2,'ERROR','N1','Loop1000A','834 requires N1*P5 (Plan Sponsor)'));
        if(!body.find(s=>s.elements[0]==='N1'&&['IN','PR'].includes(s.elements[1])))e.push(mkErr(2,'ERROR','N1','Loop1000B','834 requires N1*IN (Payer)'));
        body.filter(s=>s.elements[0]==='INS').forEach(function(ins,idx){
          if(!ins.elements[1])e.push(mkErr(2,'ERROR','INS','INS'+(idx+1)+'-01','INS01 Member Indicator required'));
          if(!ins.elements[2])e.push(mkErr(2,'ERROR','INS','INS'+(idx+1)+'-02','INS02 Relationship Code required'));
          if(!ins.elements[3])e.push(mkErr(2,'ERROR','INS','INS'+(idx+1)+'-03','INS03 Maintenance Type Code required'));
          if(!ins.elements[5])e.push(mkErr(2,'ERROR','INS','INS'+(idx+1)+'-05','INS05 Benefit Status Code required'));
          if(ins.elements[5]&&!BSTATUS[ins.elements[5]])e.push(mkErr(2,'WARN','INS','INS'+(idx+1)+'-05','INS05 unrecognized: '+ins.elements[5]));
        });
        if(body.filter(s=>s.elements[0]==='INS').length>0&&!body.find(s=>s.elements[0]==='NM1'&&s.elements[1]==='IL'))e.push(mkErr(2,'ERROR','NM1','Loop2100A','834 Loop 2100A requires NM1*IL (Member Name)'));
      }
      if(ts.code==='837'){
        if(!ids.includes('BHT'))e.push(mkErr(2,'ERROR','BHT','BHT','837 requires BHT segment'));
        if(!body.find(s=>s.elements[0]==='NM1'&&s.elements[1]==='41'))e.push(mkErr(2,'ERROR','NM1','Loop1000A','837 requires NM1*41 (Submitter)'));
        if(!body.find(s=>s.elements[0]==='NM1'&&s.elements[1]==='40'))e.push(mkErr(2,'ERROR','NM1','Loop1000B','837 requires NM1*40 (Receiver)'));
        if(!ids.includes('HL'))e.push(mkErr(2,'ERROR','HL','--','837 requires HL segments'));
        body.filter(s=>s.elements[0]==='CLM').forEach(function(clm,idx){
          if(!clm.elements[1])e.push(mkErr(2,'ERROR','CLM','CLM'+(idx+1)+'-01',"CLM01 Claim ID required"));
          if(!clm.elements[2])e.push(mkErr(2,'ERROR','CLM','CLM'+(idx+1)+'-02','CLM02 Charge Amount required'));
          if(clm.elements[2]&&isNaN(parseFloat(clm.elements[2])))e.push(mkErr(2,'ERROR','CLM','CLM'+(idx+1)+'-02','CLM02 must be numeric'));
        });
        body.filter(s=>s.elements[0]==='NM1'&&s.elements[8]==='XX').forEach(function(nm1){
          const npi=nm1.elements[9];
          if(!npi)e.push(mkErr(2,'ERROR','NM1','NM1-09','NPI required when NM108=XX'));
          else if(!/^\d{10}$/.test(npi))e.push(mkErr(2,'ERROR','NM1','NM1-09','NPI must be 10 digits, found: '+npi));
        });
        let lxNum=0;
        body.filter(s=>s.elements[0]==='LX').forEach(function(lx){lxNum++;if(parseInt(lx.elements[1])!==lxNum)e.push(mkErr(2,'WARN','LX','LX01','LX01 must increment from 1 — expected '+lxNum+' found '+lx.elements[1]));});
      }
      if(ts.code==='835'){
        if(!ids.includes('BPR'))e.push(mkErr(2,'ERROR','BPR','BPR','835 requires BPR (Financial Information)'));
        if(!ids.includes('TRN'))e.push(mkErr(2,'WARN','TRN','TRN','835 TRN (Trace Number) recommended'));
        const bpr=body.find(s=>s.elements[0]==='BPR');
        if(bpr){if(bpr.elements[2]&&isNaN(parseFloat(bpr.elements[2])))e.push(mkErr(2,'ERROR','BPR','BPR02','BPR02 must be numeric'));if(!['C','D'].includes(bpr.elements[3]))e.push(mkErr(2,'WARN','BPR','BPR03','BPR03 must be C or D'));}
        body.filter(s=>s.elements[0]==='CLP').forEach(function(clp,idx){if(!clp.elements[1])e.push(mkErr(2,'ERROR','CLP','CLP'+(idx+1)+'-01','CLP01 required'));if(!clp.elements[2])e.push(mkErr(2,'ERROR','CLP','CLP'+(idx+1)+'-02','CLP02 required'));});
      }
      return e;
    }

    function snip3(ts){
      const e=[],body=ts._rawBody||[];
      if(ts.code==='837'){
        body.filter(s=>s.elements[0]==='CLM').forEach(function(clm,ci){
          const clmAmt=parseFloat(clm.elements[2])||0;let inClaim=false,lineTotal=0;
          body.forEach(function(seg){if(seg===clm){inClaim=true;return;}if(inClaim&&(seg.elements[0]==='CLM'||seg.elements[0]==='HL'))inClaim=false;if(inClaim&&seg.elements[0]==='SV1')lineTotal+=parseFloat(seg.elements[2])||0;});
          if(lineTotal>0&&Math.abs(lineTotal-clmAmt)>0.01)e.push(mkErr(3,'WARN','CLM','CLM'+(ci+1)+'-02','SNIP3: CLM02 ($'+clmAmt.toFixed(2)+') vs SV1 sum ($'+lineTotal.toFixed(2)+')'));
        });
      }
      if(ts.code==='835'){
        const bpr=body.find(s=>s.elements[0]==='BPR');
        const totalPaid=body.filter(s=>s.elements[0]==='CLP').reduce(function(sum,clp){return sum+(parseFloat(clp.elements[4])||0);},0);
        if(bpr&&totalPaid>0){const bprAmt=parseFloat(bpr.elements[2])||0;if(Math.abs(bprAmt-totalPaid)>0.01)e.push(mkErr(3,'WARN','BPR','BPR02','SNIP3: BPR02 ($'+bprAmt.toFixed(2)+') vs CLP sum ($'+totalPaid.toFixed(2)+')'));}
        body.filter(s=>s.elements[0]==='SVC').forEach(function(svc,idx){const charged=parseFloat(svc.elements[2])||0,paid=parseFloat(svc.elements[3])||0;if(paid>charged)e.push(mkErr(3,'ERROR','SVC','SVC'+(idx+1)+'-03','SNIP3: Paid ($'+paid+') exceeds charged ($'+charged+')'));});
      }
      return e;
    }

    function snip4(ts){
      const e=[],body=ts._rawBody||[];
      body.filter(s=>s.elements[0]==='NM1').forEach(function(nm1,idx){
        if(nm1.elements[2]==='1'&&!nm1.elements[3])e.push(mkErr(4,'ERROR','NM1','NM1'+(idx+1)+'-03','SNIP4: NM102=1 (Person) requires NM103 Last Name'));
        if(nm1.elements[8]&&!nm1.elements[9])e.push(mkErr(4,'ERROR','NM1','NM1'+(idx+1)+'-09','SNIP4: NM108 ('+nm1.elements[8]+') present but NM109 missing'));
        if(nm1.elements[9]&&!nm1.elements[8])e.push(mkErr(4,'ERROR','NM1','NM1'+(idx+1)+'-08','SNIP4: NM109 present but NM108 qualifier missing'));
      });
      body.filter(s=>s.elements[0]==='DMG').forEach(function(dmg,idx){
        if(!dmg.elements[1])e.push(mkErr(4,'ERROR','DMG','DMG'+(idx+1)+'-01','SNIP4: DMG01 Date Format Qualifier missing'));
        if(!dmg.elements[2])e.push(mkErr(4,'ERROR','DMG','DMG'+(idx+1)+'-02','SNIP4: DMG02 Date of Birth missing'));
        if(dmg.elements[1]==='D8'&&dmg.elements[2]&&!isValidD8(dmg.elements[2]))e.push(mkErr(4,'ERROR','DMG','DMG'+(idx+1)+'-02','SNIP4: Birth Date invalid — '+dmg.elements[2]));
      });
      body.filter(s=>s.elements[0]==='DTP').forEach(function(dtp,idx){
        if(!dtp.elements[1])e.push(mkErr(4,'ERROR','DTP','DTP'+(idx+1)+'-01','SNIP4: DTP01 qualifier required'));
        if(!dtp.elements[2])e.push(mkErr(4,'ERROR','DTP','DTP'+(idx+1)+'-02','SNIP4: DTP02 format qualifier required'));
        if(!dtp.elements[3])e.push(mkErr(4,'ERROR','DTP','DTP'+(idx+1)+'-03','SNIP4: DTP03 date value required'));
      });
      body.filter(s=>s.elements[0]==='REF').forEach(function(ref,idx){
        if(!ref.elements[1])e.push(mkErr(4,'ERROR','REF','REF'+(idx+1)+'-01','SNIP4: REF01 qualifier required'));
        if(!ref.elements[2])e.push(mkErr(4,'ERROR','REF','REF'+(idx+1)+'-02','SNIP4: REF02 value required'));
      });
      if(ts.code==='834'){body.filter(s=>s.elements[0]==='HD').forEach(function(hd,idx){if(!hd.elements[1])e.push(mkErr(4,'ERROR','HD','HD'+(idx+1)+'-01','SNIP4: HD01 Maintenance Type Code required'));if(!hd.elements[5])e.push(mkErr(4,'INFO','HD','HD'+(idx+1)+'-05','SNIP4: HD05 Coverage Level Code recommended'));});}
      return e;
    }

    function snip5(ts){
      const e=[],body=ts._rawBody||[];
      body.filter(s=>s.elements[0]==='DTP').forEach(function(dtp,idx){if(dtp.elements[2]==='D8'&&dtp.elements[3]&&!isValidD8(dtp.elements[3]))e.push(mkErr(5,'ERROR','DTP','DTP'+(idx+1)+'-03','SNIP5: Invalid date "'+dtp.elements[3]+'" — does not exist in calendar'));});
      body.filter(s=>s.elements[0]==='N4').forEach(function(n4,idx){
        const state=n4.elements[2];if(state&&!VALID_STATES.has(state.toUpperCase()))e.push(mkErr(5,'WARN','N4','N4'+(idx+1)+'-02','SNIP5: "'+state+'" is not a valid US state code'));
        const zip=n4.elements[3];if(zip&&!/^\d{5}(-\d{4})?$/.test(zip))e.push(mkErr(5,'WARN','N4','N4'+(idx+1)+'-03','SNIP5: ZIP "'+zip+'" invalid format'));
      });
      if(ts.code==='837'){
        body.filter(s=>s.elements[0]==='HI').forEach(function(hi,idx){
          hi.elements.slice(1).filter(Boolean).forEach(function(el,ei){
            const parts=el.split(':'),qualifier=parts[0],code=parts[1];
            if((qualifier==='ABK'||qualifier==='ABF'||qualifier==='BK')&&code){if(!/^[A-Z]/.test(code))e.push(mkErr(5,'ERROR','HI','HI'+(idx+1)+'-'+(ei+1),'SNIP5: ICD-10 "'+code+'" must start with A-Z'));if(code.length<3||code.length>7)e.push(mkErr(5,'WARN','HI','HI'+(idx+1)+'-'+(ei+1),'SNIP5: ICD-10 "'+code+'" length ('+code.length+') outside range 3-7'));}
            if(qualifier==='HC'&&code&&!/^\d{5}/.test(code))e.push(mkErr(5,'WARN','HI','HI'+(idx+1)+'-'+(ei+1),'SNIP5: CPT "'+code+'" should start with 5 digits'));
          });
        });
        body.filter(s=>s.elements[0]==='CLM').forEach(function(clm,idx){const loc=clm.elements[5];if(loc){const pos=loc.split(':')[0];if(pos&&!POS[pos])e.push(mkErr(5,'WARN','CLM','CLM'+(idx+1)+'-05','SNIP5: Place of Service "'+pos+'" not in valid HIPAA code set'));}});
      }
      if(ts.code==='834'){
        body.filter(s=>s.elements[0]==='INS').forEach(function(ins,idx){
          if(ins.elements[2]&&!REL[ins.elements[2]])e.push(mkErr(5,'WARN','INS','INS'+(idx+1)+'-02','SNIP5: Relationship Code "'+ins.elements[2]+'" not valid'));
          if(ins.elements[8]&&!EMPST[ins.elements[8]])e.push(mkErr(5,'WARN','INS','INS'+(idx+1)+'-08','SNIP5: Employment Status "'+ins.elements[8]+'" not valid'));
        });
        body.filter(s=>s.elements[0]==='HD').forEach(function(hd,idx){
          if(hd.elements[3]&&!INSLINE[hd.elements[3]])e.push(mkErr(5,'WARN','HD','HD'+(idx+1)+'-03','SNIP5: Insurance Line "'+hd.elements[3]+'" not valid'));
          if(hd.elements[5]&&!COVERAGE[hd.elements[5]])e.push(mkErr(5,'WARN','HD','HD'+(idx+1)+'-05','SNIP5: Coverage Level "'+hd.elements[5]+'" not valid'));
        });
      }
      return e;
    }

    function snip6(ts){
      const e=[],body=ts._rawBody||[];
      if(ts.code==='837'){
        const clmCount=body.filter(s=>s.elements[0]==='CLM').length;const sv1Count=body.filter(s=>s.elements[0]==='SV1').length;
        if(clmCount>0&&sv1Count===0)e.push(mkErr(6,'WARN','SV1','--','SNIP6: 837P should include SV1 (Professional Service)'));
        body.filter(s=>s.elements[0]==='LX').forEach(function(lx){
          const lxPos=body.indexOf(lx);const nextLx=body.findIndex(function(s,i){return i>lxPos&&s.elements[0]==='LX';});
          const slice=body.slice(lxPos+1,nextLx>-1?nextLx:undefined);
          if(!slice.some(s=>s.elements[0]==='DTP'&&s.elements[1]==='472'))e.push(mkErr(6,'WARN','DTP','LX'+lx.elements[1],'SNIP6: LX*'+lx.elements[1]+' missing DTP*472 (Service Date)'));
        });
        const billing=body.find(s=>s.elements[0]==='NM1'&&s.elements[1]==='85');
        if(billing&&billing.elements[8]!=='XX')e.push(mkErr(6,'WARN','NM1','NM1*85','SNIP6: Billing Provider should use XX (NPI) qualifier'));
      }
      if(ts.code==='834'){
        body.filter(s=>s.elements[0]==='INS'&&s.elements[5]==='C').forEach(function(ins,idx){e.push(mkErr(6,'INFO','INS','INS'+(idx+1),'SNIP6: COBRA member — verify DTP*348/349 in Loop 2300'));});
        body.filter(s=>s.elements[0]==='INS'&&s.elements[3]==='024').forEach(function(ins,idx){
          const insPos=body.indexOf(ins);const nextIns=body.findIndex(function(s,i){return i>insPos&&s.elements[0]==='INS';});
          const slice=body.slice(insPos,nextIns>-1?nextIns:undefined);
          if(!slice.some(s=>s.elements[0]==='DTP'&&['349','357','303'].includes(s.elements[1])))e.push(mkErr(6,'WARN','DTP','INS'+(idx+1),'SNIP6: Termination member should have DTP*349 (Benefit End Date)'));
        });
      }
      if(ts.code==='835'){
        body.filter(s=>s.elements[0]==='CLP').forEach(function(clp,idx){
          const clpPos=body.indexOf(clp);const nextClp=body.findIndex(function(s,i){return i>clpPos&&s.elements[0]==='CLP';});
          const slice=body.slice(clpPos+1,nextClp>-1?nextClp:undefined);
          if(!slice.some(s=>s.elements[0]==='SVC'))e.push(mkErr(6,'INFO','SVC','CLP'+(idx+1),'SNIP6: CLP should include SVC (Service Payment)'));

    // ─── DESIGN TOKENS — Light Professional Theme ─────────────────
    const BG='#f0f4f8',NAV='#ffffff',CARD='#ffffff',CARD2='#f8fafc',BORD='#e2e8f0',BORD2='#cbd5e1';
    const TEXT='#1e293b',MUTED='#64748b',FAINT='#94a3b8';
    const ORG='#e8650a',ORG2='#c2540a',BLU='#1d4ed8',GRN='#16a34a',RED='#dc2626',YEL='#d97706',PUR='#7c3aed',CYN='#0891b2';
    const MONO="'Courier New',Courier,monospace",SANS="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif";
    const SC={1:BLU,2:CYN,3:GRN,4:YEL,5:PUR,6:ORG};
    const SNIP_INFO=[{n:1,l:'Syntax Integrity',d:'ISA/IEA structure, GS/GE balance, ST/SE count, control numbers'},{n:2,l:'IG Requirements',d:'Required segments, element rules, NPI format, LX increment'},{n:3,l:'Balance Testing',d:'SV1 sum vs CLM total, 835 BPR vs CLP payment totals'},{n:4,l:'Inter-Segment Rules',d:'Conditional pairs: NM108/109, DTP 3-element rule, HD presence'},{n:5,l:'External Code Sets',d:'ICD-10, state codes, ZIP format, date calendar validation'},{n:6,l:'Service-Specific',d:'DTP*472 per LX, COBRA members, termination dates, NPI qualifier'}];
    function rgb(h){const m={[RED]:'220,38,38',[YEL]:'217,119,6',[GRN]:'22,163,74',[BLU]:'29,78,216',[CYN]:'8,145,178',[PUR]:'124,58,237',[ORG]:'232,101,10',[ORG2]:'194,84,10'};return m[h]||'100,116,139';}

    // ─── UI PRIMITIVES ───────────────────────────────────────────
    function Pill({color,label}){return<span style={{background:'rgba('+rgb(color)+',0.1)',color,fontSize:11,fontWeight:700,padding:'4px 12px',borderRadius:16,border:'1px solid rgba('+rgb(color)+',0.25)',whiteSpace:'nowrap'}}>{label}</span>;}
    function FBtn({active,onClick,label,color}){return<button onClick={onClick} style={{background:active?color:'transparent',color:active?'#fff':color,border:'1px solid '+(active?color:'rgba('+rgb(color)+',0.35)'),borderRadius:20,padding:'4px 12px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:SANS}}>{label}</button>;}
    function SHead({label,color}){return<div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,marginTop:8}}><div style={{width:3,height:18,background:color,borderRadius:2,flexShrink:0}}/><span style={{fontSize:13,fontWeight:800,color:TEXT}}>{label}</span></div>;}
    function Btn({onClick,children,variant,sm,disabled,sx={}}){const v=variant||'primary';const base={display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,border:'none',cursor:disabled?'not-allowed':'pointer',fontFamily:SANS,fontWeight:700,borderRadius:8,transition:'all 0.18s',opacity:disabled?0.5:1,fontSize:sm?12:13,padding:sm?'6px 14px':'10px 22px',...sx};const vs={primary:{background:'linear-gradient(135deg,'+ORG+','+ORG2+')',color:'#fff',boxShadow:'0 2px 8px rgba(232,101,10,0.3)'},ghost:{background:'transparent',color:MUTED,border:'1px solid '+BORD},outline:{background:'transparent',color:ORG,border:'1px solid '+ORG},subtle:{background:'#f8fafc',color:TEXT,border:'1px solid '+BORD}};return<button style={{...base,...vs[v]}} onClick={onClick} disabled={disabled}>{children}</button>;}

    // ─── SEGMENT CARD ────────────────────────────────────────────
    function SegCard({seg}){
      const hasErr=seg.errors&&seg.errors.length>0;
      return(
        <div style={{marginBottom:8,borderRadius:8,overflow:'hidden',border:'1px solid '+(hasErr?'rgba(220,38,38,0.4)':BORD),background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
          <div style={{background:hasErr?'#fef2f2':'#f8fafc',padding:'7px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid '+(hasErr?'#fecaca':BORD)}}>
            <span style={{fontSize:12,fontWeight:700,color:hasErr?RED:TEXT}}>{seg.name}</span>
            {hasErr&&<span style={{fontSize:10,fontWeight:800,color:RED,background:'#fee2e2',padding:'2px 8px',borderRadius:10,border:'1px solid #fca5a5'}}>⚠ {seg.errors.length} error{seg.errors.length>1?'s':''}</span>}
          </div>
          <div style={{background:'#eff6ff',borderBottom:'1px solid #dbeafe',padding:'5px 14px',fontFamily:MONO,fontSize:11,color:'#1d4ed8',wordBreak:'break-all',lineHeight:1.5}}>{seg.raw}</div>

              <tbody>

                  <tr key={i} style={{borderBottom:'1px solid #f1f5f9',background:i%2===0?'#fff':'#fafafa'}}>

                    <td style={{padding:'7px 14px',color:f.error?RED:TEXT}}>
                      {f.error&&<span style={{marginRight:6}}>⚠️</span>}
                      {f.code?<span><span style={{fontFamily:MONO,fontSize:11,color:MUTED}}>{f.value}</span><span style={{color:TEXT,fontWeight:500}}> — {f.code}</span></span>:<span style={{fontFamily:MONO,fontSize:11,color:'#334155'}}>{f.value}</span>}
                      {f.error&&<div style={{color:RED,fontSize:11,marginTop:3,fontStyle:'italic'}}>{f.error}</div>}

    // ─── LOOP CARD ───────────────────────────────────────────────
    const LC={HDR:{dot:'#94a3b8',bg:'#f8fafc',border:'#e2e8f0'},'1000A':{dot:'#d97706',bg:'#fffbeb',border:'#fde68a'},'1000B':{dot:'#0891b2',bg:'#f0f9ff',border:'#bae6fd'},'2000':{dot:'#7c3aed',bg:'#faf5ff',border:'#e9d5ff'},'2100A':{dot:'#16a34a',bg:'#f0fdf4',border:'#bbf7d0'},'2300':{dot:'#e8650a',bg:'#fff7ed',border:'#fed7aa'},'2400':{dot:'#dc2626',bg:'#fef2f2',border:'#fecaca'},'2100':{dot:'#16a34a',bg:'#f0fdf4',border:'#bbf7d0'},'2110':{dot:'#d97706',bg:'#fffbeb',border:'#fde68a'},HL_20:{dot:'#1d4ed8',bg:'#eff6ff',border:'#bfdbfe'},HL_22:{dot:'#7c3aed',bg:'#faf5ff',border:'#e9d5ff'},HL_23:{dot:'#0891b2',bg:'#f0f9ff',border:'#bae6fd'}};
    function LoopCard({loop,defaultOpen}){
      const [open,setOpen]=useState(defaultOpen!==false);

        <div style={{marginBottom:10,borderRadius:10,overflow:'hidden',border:'1px solid '+(errs>0?'#fca5a5':lc.border),background:lc.bg,boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>

            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:lc.dot,boxShadow:'0 0 6px '+lc.dot+'80',display:'inline-block',flexShrink:0}}/>
              <span style={{fontSize:13,fontWeight:700,color:TEXT}}>{loop.name}</span>
              <span style={{fontSize:10,color:MUTED,background:'#f1f5f9',padding:'2px 8px',borderRadius:10,fontWeight:600,border:'1px solid '+BORD}}>{loop.segments.length} seg</span>
              {errs>0&&<span style={{fontSize:10,fontWeight:800,color:RED,background:'#fee2e2',padding:'2px 9px',borderRadius:10,border:'1px solid #fca5a5'}}>⚠ {errs}</span>}
            </div>
            <span style={{fontSize:11,color:MUTED,userSelect:'none',flexShrink:0}}>{open?'▼ hide':'▶ show'}</span>
          </div>
          {open&&<div style={{padding:'10px 14px'}}>{loop.segments.map(function(s,i){return<SegCard key={i} seg={s}/>;})}</div>}
        </div>
      );
    }

    // ─── VALIDATION PANEL ────────────────────────────────────────
    function ValidationPanel({vr}){
      const [open,setOpen]=useState(true);
      const [filter,setFilter]=useState(0);
      const allIssues=[].concat(vr.s1,vr.s2,vr.s3,vr.s4,vr.s5,vr.s6);

        <div style={{background:'#fff',border:'1px solid '+BORD,borderRadius:12,marginBottom:20,overflow:'hidden',boxShadow:'0 1px 6px rgba(0,0,0,0.06)'}}>

              <div>
                <div style={{fontWeight:800,fontSize:15,color:TEXT}}>HIPAA SNIP Validation Report</div>

                  <div key={si.n} onClick={function(){setFilter(isActive?0:si.n);}} style={{cursor:'pointer',background:isActive?'rgba('+rgb(col)+',0.08)':'#f8fafc',border:'1px solid '+(isActive?col:BORD),borderRadius:8,padding:10,transition:'all 0.15s',boxShadow:isActive?'0 0 0 2px rgba('+rgb(col)+',0.15)':'none'}}>

                    </div>

    // ─── RESULTS VIEW ────────────────────────────────────────────
    function ResultsView({parsed,fileName,onReset,vr}){
      if(parsed.error)return(<div style={{padding:28}}><div style={{background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.35)',borderRadius:12,padding:24,marginBottom:20}}><div style={{color:RED,fontWeight:800,fontSize:16,marginBottom:10}}>⚠ Parse Error</div><div style={{fontFamily:MONO,fontSize:13,color:'#fca5a5',lineHeight:1.6}}>{parsed.error}</div></div><Btn onClick={onReset} variant="outline">← Try Another File</Btn></div>);
      const isa=parsed.envelope.ISA;
      const allTS=parsed.functionalGroups.flatMap(function(fg){return fg.transactionSets;});

              {[['ISA Sender ID',isa.senderQualifier+':'+isa.senderId],['ISA Receiver ID',isa.receiverQualifier+':'+isa.receiverId],['GS Sender ID',(parsed.functionalGroups[0]||{}).senderID],['GS Receiver ID',(parsed.functionalGroups[0]||{}).receiverID]].map(function(p,i){return(<div key={i} style={{padding:'10px 16px',borderBottom:'1px solid '+BORD,borderRight:i%2===0?'1px solid '+BORD:'none'}}><div style={{fontSize:10,color:MUTED,marginBottom:3,fontWeight:600}}>{p[0]}</div><div style={{fontFamily:MONO,fontSize:13,fontWeight:700,color:ORG}}>{p[1]}</div></div>);})}</div></div>
          <SHead label="ISA — Interchange Control Header" color={ORG}/>

                  </h1>
                  <p style={{margin:'0 0 28px',fontSize:15,color:'rgba(255,255,255,0.7)',maxWidth:520,lineHeight:1.8}}>
                    Parse and validate HIPAA X12 EDI files against full SNIP Level 1–6 rules — syntax integrity, implementation guide requirements, balance checks, code set validation, and more.
                  </p>
                  <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                    <Btn sx={{fontSize:14,padding:'12px 28px',borderRadius:10}}>GET STARTED</Btn>
                    <button onClick={function(){setPage('samples');}} style={{background:'rgba(255,255,255,0.1)',color:'#fff',border:'1px solid rgba(255,255,255,0.25)',borderRadius:10,padding:'12px 28px',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:SANS,backdropFilter:'blur(4px)',transition:'all 0.2s'}}>VIEW EDI SAMPLES</button>
                  </div>
                  <div style={{marginTop:24,fontSize:11,color:'rgba(255,255,255,0.4)'}}>
                    Built by <strong style={{color:'rgba(255,255,255,0.6)'}}>Tharun Kilaru</strong> · International Benefits Administrators (IBA) · Garden City, NY
                  </div>
                </div>
              </div>

              {/* ── SNIP BADGE BAR ── */}
              <div style={{background:'#fff',borderBottom:'1px solid #e2e8f0',padding:'10px 24px',overflowX:'auto',boxShadow:'0 1px 4px rgba(0,0,0,0.04)'}}>
                <div style={{maxWidth:1300,margin:'0 auto',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:'#94a3b8',fontWeight:700,marginRight:4,flexShrink:0,letterSpacing:0.5}}>VALIDATION ENGINE:</span>
                  {SNIP_INFO.map(function(si){const col=SC[si.n];return(
                    <div key={si.n} style={{display:'flex',alignItems:'center',gap:5,background:'rgba('+rgb(col)+',0.08)',border:'1px solid rgba('+rgb(col)+',0.2)',borderRadius:20,padding:'4px 12px',fontSize:11,fontWeight:700,color:col,flexShrink:0,whiteSpace:'nowrap'}}>
                      <span style={{width:5,height:5,borderRadius:'50%',background:col,display:'inline-block'}}/>SNIP {si.n} · {si.l}
                    </div>
                  );})}
                </div>
              </div>
            </>
          )}

          {/* ── MAIN CONTENT ── */}
          <main style={{maxWidth:1300,margin:'0 auto',padding:'24px 0'}}>
            {page==='upload'&&!parsed&&<UploadPage onParsed={handleParsed}/>}
            {page==='upload'&&parsed&&<ResultsView parsed={parsed} fileName={fileName} onReset={function(){setParsed(null);}} vr={vr}/>}
            {page==='myfiles'&&<MyFilesPage files={myFiles} onLoad={function(f){const p=parseEDI(f.content||'');const v=runValidation(p);setParsed(p);setFileName(f.name);setVr(v);setPage('upload');}}/>}
            {page==='samples'&&<SamplesPage onLoad={function(p,name,content,v){setParsed(p);setFileName(name);setVr(v);setPage('upload');}}/>}
          </main>

          {/* ── FOOTER ── */}
          <footer style={{background:'linear-gradient(135deg,#1e3a5f,#1d4ed8)',padding:'20px 24px',marginTop:48}}>
            <div style={{maxWidth:1300,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
              <div style={{fontSize:12,color:'rgba(255,255,255,0.7)'}}>IBATPA EDI Viewer · Built by <strong style={{color:'#fff'}}>Tharun Kilaru</strong> · International Benefits Administrators · © 2026</div>
              <div style={{display:'flex',gap:10,fontSize:11,color:'rgba(255,255,255,0.4)'}}><span>HIPAA X12 5010</span><span>·</span><span>SNIP Levels 1–6</span><span>·</span><span>834 · 837 · 835 · 270/271</span></div>
            </div>
          </footer>
        </div>
      );
    }

    // ─── RENDER ──────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
